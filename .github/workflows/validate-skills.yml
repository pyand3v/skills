name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  push:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pyand3v/skill-validator@07a482abe2f51a4f352a02c966826a77d5c2cccc # v0.2.0
        with:
          path: skills
          format: text
