name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - "README.md"
      - ".skill-validator.yaml"
      - "AGENTS.md"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - ".skill-validator.yaml"
      - "AGENTS.md"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pyand3v/skill-validator@901e3d6fcaff32c1a29a04ba7d754bcb0dfb1976 # v0.3.0
        with:
          mode: collection
          repo-root: .
          skills-dir: skills
          strict: "true"
          format: github
