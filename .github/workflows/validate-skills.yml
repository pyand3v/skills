name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  push:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pyand3v/skill-validator@d973c9248e6cd5ea0e64693665a48a06c2120b2d
        with:
          path: skills
          format: text
